 var left=T.p?Math.ceil(T.pl/1000):Math.ceil((T.end-Date.now())/1000),rest=left;for(var j=T.i+1;j<T.s.length;j++)rest+=T.s[j].d;

function tick(){if(T.p||T.i>=T.s.length)return;var l=draw();if(l!==T.lb){T.lb=l;if(l>=1&&l<=3)beep(880,.12)}if(l<=0){beep(1320,.35);go(T.i+1)}}
